name: Release Build

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build
        required: true
        type: string
      artifact-prefix:
        description: Prefix for uploaded artifact names
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: source distribution
            runner: ubuntu-latest
            python: "3.14"
            artifact-kind: sdist
            command: uv run --locked nox -s build-release -- --kind sdist --out-dir dist

          - name: Linux x86-64 abi3 wheel
            runner: ubuntu-latest
            python: "3.10"
            artifact-kind: wheel
            command: uv run --locked nox -s build-release -- --kind wheel --target x86_64-unknown-linux-gnu --interpreter python --out-dir dist
          - name: Linux ARM64 abi3 wheel
            runner: ubuntu-24.04-arm
            python: "3.10"
            artifact-kind: wheel
            command: uv run --locked nox -s build-release -- --kind wheel --target aarch64-unknown-linux-gnu --interpreter python --out-dir dist
          - name: macOS x86-64 abi3 wheel
            runner: macos-15-intel
            python: "3.10"
            artifact-kind: wheel
            command: uv run --locked nox -s build-release -- --kind wheel --target x86_64-apple-darwin --interpreter python --out-dir dist
          - name: macOS ARM64 abi3 wheel
            runner: macos-15
            python: "3.10"
            artifact-kind: wheel
            command: uv run --locked nox -s build-release -- --kind wheel --target aarch64-apple-darwin --interpreter python --out-dir dist
          - name: Windows x64 abi3 wheel
            runner: windows-latest
            python: "3.10"
            artifact-kind: wheel
            command: uv run --locked nox -s build-release -- --kind wheel --target x86_64-pc-windows-msvc --interpreter python --out-dir dist

    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build and smoke-test the release artifact
        run: ${{ matrix.command }}

      - name: Upload the checked artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-prefix }}-${{ strategy.job-index }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
