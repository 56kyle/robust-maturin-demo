name: Build Rust Crates

on:
  pull_request:
    paths:
      - "rust/**/*.rs"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "noxfile.py"
      - ".github/workflows/build-rust.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "rust/**/*.rs"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "noxfile.py"
      - ".github/workflows/build-rust.yml"

  workflow_dispatch:

jobs:
  build-rust:
    name: Build Rust Crates
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-latest
            target: i686-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: "rust/"
          key: ${{ matrix.platform.target }}

      - name: Set up cross-compilation toolchain (Linux)
        if: contains(matrix.platform.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          if [[ "${{ matrix.platform.target }}" == *"aarch64"* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
          if [[ "${{ matrix.platform.target }}" == *"musl"* ]]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".github/workflows/.python-version"

      - name: Build Rust crates for target
        run: |
          cd rust
          cargo build --release --target ${{ matrix.platform.target }}

      - name: Upload Rust build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-artifacts-${{ matrix.platform.target }}
          path: rust/target/${{ matrix.platform.target }}/release/
          retention-days: 7
